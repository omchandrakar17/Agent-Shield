[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.6,<3",
  "jsonschema>=4.23,<5",
  "pyjwt>=2.9,<3",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]
firebase = ["firebase-admin>=6.5,<7"]
gcp = [
  "google-cloud-firestore>=2.19,<3",
  "google-cloud-pubsub>=2.23,<3",
  "google-cloud-secret-manager>=2.21,<3",
  "google-cloud-bigquery>=3.27,<4",
  "google-cloud-logging>=3.11,<4",
  "google-genai>=1.0,<2",
  "pg8000>=1.31,<2",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
