services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentshield-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AGENTSHIELD_DATABASE_URL=sqlite:////app/data/agentshield.db
      - AGENTSHIELD_CORS_ORIGINS=*
      - AGENTSHIELD_MODEL_ARMOR_ENABLED=false
    volumes:
      - agentshield-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentshield-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  agentshield-data:
    driver: local

